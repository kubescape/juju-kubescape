summary: |
  Deprecated Kubescape Juju charm. Use the maintained Helm installation.

description: |
  This Juju charm is deprecated and is being retired. Do not use it for new
  deployments. This retirement applies only to the Juju charm, not to Kubescape
  or its Operator.

  Deprecation was announced on 26 October 2026. The migration window ends on
  25 November 2026, after which the repository is planned to be archived.

  Existing users should plan a migration to the maintained Kubescape Operator
  installation using Helm or Argo CD:
  https://kubescape.io/docs/install-operator/

  The published charm contains old dependencies and Kubescape components.
  Dependency security advisories remain unresolved. Closing Charmhub channels
  does not patch or remove existing installations. See the repository for
  migration guidance:
  https://github.com/kubescape/juju-kubescape
